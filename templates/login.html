{% extends "base.html" %}
{% block title %}登录 - 图书管理系统{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>登录</h1>
  <p class="sub">图书管理系统</p>
  <form method="post">
    <label>用户名
      <input type="text" name="username" required autofocus placeholder="请输入用户名">
    </label>
    <label>密码
      <input type="password" name="password" required placeholder="请输入密码">
    </label>
    <button class="btn btn-primary btn-block" type="submit">登 录</button>
  </form>
  <p class="auth-link">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
  <div class="demo-tip">
    <b>演示账号</b><br>
    管理员：admin / admin123<br>
    读者：reader / reader123
  </div>
</div>
{% endblock %}
